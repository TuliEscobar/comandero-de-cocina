<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍽️ Comandero de Cocina</title>
<meta name="theme-color" content="#1a1a1a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a1a1a;  /* negro */
      --success: #2ecc71;  /* verde */
      --dark: #0a0a0a;
      --light: #f5f5f5;
      --white: #FFFFFF;
      --accent: #444444;  /* gris medio */
      --text: #333;
      --text-muted: #888;
      --bg: #FFFFFF;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* HEADER */
    .header {
      background: var(--dark);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }

    /* TABS */
    .tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 14px 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
      position: relative;
    }
    .tab.active { color: var(--primary); }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 25%;
      width: 50%;
      height: 3px;
      background: var(--primary);
      border-radius: 2px;
    }
    .tab .badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 3px;
    }

    /* SCREEN */
    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty .icon { font-size: 64px; opacity: 0.5; margin-bottom: 16px; }
    .empty h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }

    /* ===== PANTALLA: MENÚ ===== */
    .categorias {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 12px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .categorias::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex: 1 1 auto;
      min-width: 0;
      background: #f0f0f0;
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .cat-tab .icon { flex-shrink: 0; }
    .cat-tab span { overflow: hidden; text-overflow: ellipsis; }
    .cat-tab.active {
      background: #FFF3E0;
      color: var(--primary);
      border-color: var(--primary);
    }

    .platos-list { display: flex; flex-direction: column; gap: 10px; }
    .plato-btn {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }
    .plato-btn.selected {
      border-color: #00C853;
      background: #E8F5E9;
      box-shadow: 0 0 0 3px rgba(0,200,83,0.25);
    }
    .plato-btn.selected .nombre {
      color: #00C853;
    }
    .plato-btn.selected .cantidad-control {
      background: #00C853;
    }
    .plato-btn:active { transform: scale(0.97); }

    .plato-left { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .plato-btn .nombre { font-size: 16px; font-weight: 700; color: #111; line-height: 1.3; }
    .plato-btn .ingredientes { font-size: 12px; color: var(--text-muted); line-height: 1.3; }
    .nota-chip {
      display: inline-block;
      background: #FFF8E1;
      color: #E65100;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-nota-menu {
      background: rgba(212,165,116,0.15);
      border: none;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      margin-left: 6px;
      flex-shrink: 0;
    }

    /* BARRA SELECCIÓN */
    .selected-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #eee;
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
      z-index: 200;
    }
    .selected-count { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
    .generar-btn {
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .generar-btn:active { opacity: 0.8; }
    .generar-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* CONTROLES CANTIDAD */
    .cantidad-control {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .cant-btn {
      background: var(--success);
      color: #fff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .cant-num { font-size: 14px; font-weight: 700; min-width: 22px; text-align: center; }

    /* ===== PANTALLA: ACTIVAS ===== */
    .comanda-urgente {
      border: 2px solid #FF6B35 !important;
      box-shadow: 0 8px 32px rgba(255,107,53,0.25) !important;
    }
    .comanda-normal { opacity: 0.92; }
    .comanda-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid #f0f0f0;
    }
    .comanda-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    .cat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .comanda-header-right { display: flex; align-items: center; gap: 8px; }
    .comanda-urgencia-label {
      background: #FF6B35;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .comanda-numero {
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
      white-space: nowrap;
    }
    .plato-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .plato-item:last-child { border-bottom: none; }
    .plato-nombre {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .plato-ingredientes {
      font-size: 15px;
      color: #555;
      margin-top: 3px;
      line-height: 1.3;
    }
    .plato-nota {
      font-size: 14px;
      color: #333;
      font-style: italic;
      margin-top: 3px;
    }
    .comanda-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }
    .total-platos { font-size: 13px; color: #555; font-weight: 500; }
    .delete-btn {
      background: rgba(212,165,116,0.15);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: #a0522d;
      cursor: pointer;
    }
    .delete-btn:active { background: rgba(212,165,116,0.3); }

    /* FINALIZAR BTN */
    .finalizar-btn {
      background: var(--success);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .finalizar-btn:active { opacity: 0.8; }

    /* COMPLETAR BTN */
    .completar-btn {
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .completar-btn:active { opacity: 0.8; }

    /* ===== PANTALLA: HISTORIAL ===== */
    .historial-item {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      opacity: 0.85;
      border: 1px solid #e8e8e8;
    }
    .historial-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .historial-fecha {
      font-size: 12px;
      color: #999;
    }
    .historial-cat-plato {
      font-size: 15px;
      font-weight: 700;
    }
    .historial-items {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    /* ===== MODALES ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: #fff;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.25s ease-out;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      border-bottom: 1px solid #eee;
      font-size: 18px;
      font-weight: 700;
    }
    .modal-body { padding: 20px; }
    .modal-close {
      background: none;
      border: none;
      font-size: 26px;
      color: #888;
      cursor: pointer;
      line-height: 1;
    }
    .modal-q { font-size: 15px; color: #666; text-align: center; margin-bottom: 16px; }
    .resumen-list { display: flex; flex-direction: column; gap: 8px; }
    .resumen-item {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 500;
    }
    .resumen-nota {
      font-size: 12px;
      color: #333;
      font-style: italic;
      margin-top: 2px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid #eee;
    }
    .btn {
      flex: 1;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-cancel { background: #f0f0f0; color: #666; }
    .btn-confirm { background: var(--success); color: #fff; display: flex; align-items: center; gap: 6px; justify-content: center; }

    /* NOTA MODAL */
    .nota-menu-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      margin-top: 10px;
    }
    .nota-menu-input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .nota-chip {
      display: inline-block;
      background: #FFF8E1;
      color: #E65100;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }

    /* INSTALL BUTTON */
    #installBtn {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
    #installBtn:hover { opacity: 0.9; }

    @media (max-width: 390px) {
      .plato-btn .nombre { font-size: 14px; }
    }

  /* ===== TEMA CLARO / OSCURO ===== */
  #temaBtn {
    position: fixed; top: 54px; left: 8px; z-index: 999;
    border-radius: 50px; padding: 5px 11px;
    border: none; font-size: 20px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
    background: #f0f0f0;
  }
  /* Tema oscuro */
  body.dark-mode { background: #121212; color: #e0e0e0; }
  body.dark-mode .tabs { background: #1a1a1a; border-bottom-color: #333; }
  body.dark-mode .tab { color: #888; }
  body.dark-mode .tab.active { color: #f0f0f0; }
  body.dark-mode .tab .badge { background: #555; }
  body.dark-mode .screen { background: #121212; }
  body.dark-mode .plato-btn { background: #1e1e1e; border-color: #333; color: #e0e0e0; }
  body.dark-mode .plato-btn .nombre { color: #e0e0e0; }
  body.dark-mode .plato-btn .ingredientes { color: #888; }
  body.dark-mode .nota-chip { background: #3e2e00; color: #ffb300; }
  body.dark-mode .btn-nota-menu { background: rgba(212,165,116,.15); color: #D4A574; }
  body.dark-mode #selectedBar { background: #1e1e1e; border-top-color: #333; }
  body.dark-mode #generarBtn { background: #2ecc71; color: #fff; }
  body.dark-mode .modal { background: #1e1e1e; }
  body.dark-mode .resumen-item { background: #252525; }
  body.dark-mode .empty { color: #888; }
  body.dark-mode .header { background: #0a0a0a; }
  body.dark-mode #temaBtn { background: #333; }
  body.dark-mode #modalMesaInput { background: #1e1e1e; color: #e0e0e0; border-color: #333; }
  body.dark-mode #modalMesaInput:focus { border-color: #555; }
  body.dark-mode .modal-body p,
  body.dark-mode .modal-body label { color: #ccc; }
  body.dark-mode #modalBodyConfirmar p { color: #ccc; }
  body.dark-mode .resumen-item div { color: #f0f0f0; }

  </style>
</head>
<body>

<div class="header">
  <h1>Comandero</h1>
  <button id="installBtn" onclick="installPWA()">⬇ Instalar App</button>
  <button id="temaBtn" onclick="toggleTema()" title="Cambiar tema">🌓</button>
</div>

<div class="tabs">
  <button class="tab active" id="tabMenu" onclick="switchTab('menu')">&#128218; Menú</button>
  <button class="tab" id="tabPedidos" onclick="switchTab('pedidos')">&#128222; Pedidos</button>
  <button class="tab" id="tabStock" onclick="switchTab('stock')">&#128202; Stock</button>
  <button class="tab" id="tabActivas" onclick="switchTab('activas')">&#9889; Activas <span class="badge" id="badgeActivas"></span></button>
  <button class="tab" id="tabHistorial" onclick="switchTab('historial')">&#128196; Historial</button>
</div>

<!-- PANTALLA: MENÚ -->
<div class="screen active" id="screenMenu">
  <div class="categorias" id="categoriasContainer"></div>
  <div class="platos-list" id="platosContainer"></div>
  <div class="selected-bar" id="selectedBar" style="display:none;">
    <span class="selected-count" id="selectedCount">0 platos</span>
    <button class="generar-btn" id="generarBtn" onclick="abrirModal()">Generar Comanda</button>
  </div>
</div>

<!-- PANTALLA: PEDIDOS POR MESA -->
<div class="screen" id="screenPedidos">
  <div style="margin-bottom:12px;">
    <label style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;display:block;">Número de Mesa</label>
    <input type="number" id="pedidoMesa" min="1" max="99" value="1"
      style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:18px;font-weight:700;text-align:center;font-family:inherit;">
  </div>
  <p style="font-size:13px;color:#888;margin-bottom:12px;">Seleccioná los platos desde el Menú, luego tocá <strong>Enviar a Cocina</strong>.</p>
  <button class="generar-btn" id="enviarPedidoBtn" onclick="enviarPedidoCocina()" style="width:100%;margin-bottom:12px;" disabled>&#128666; Enviar a Cocina</button>
  <div id="pedidosMesaContainer" style="display:flex;flex-direction:column;gap:8px;"></div>
</div>

<!-- PANTALLA: ACTIVAS -->
<div class="screen" id="screenActivas">
  <div id="activasContainer"></div>
</div>

<!-- PANTALLA: HISTORIAL -->
<div class="screen" id="screenHistorial">
  <div id="historialContainer"></div>
</div>

<!-- PANTALLA: STOCK -->
<div class="screen" id="screenStock">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <h2 style="font-size:18px;font-weight:700;">Control de Stock</h2>
    <button id="toggleEdicionStock" onclick="toggleEdicionStock()" class="btn" style="background:var(--accent);color:#fff;padding:8px 14px;font-size:13px;border-radius:8px;cursor:pointer;border:none;font-weight:600;">✏️ Editar</button>
  </div>
  <div id="stockContainer"></div>
  <div id="editarStockPanel" style="display:none;background:#fff;border-radius:12px;padding:16px;margin-top:12px;border:1px solid #eee;">
    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px;">Agregar / Modificar Insumo</label>
    <input type="text" id="stockNombre" placeholder="Nombre (ej: tomate)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:8px;">
    <input type="number" id="stockCantidad" min="0" placeholder="Cantidad" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:8px;">
    <button onclick="agregarInsumoStock()" class="btn" style="background:var(--success);color:#fff;padding:12px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-bottom:6px;">➕ Agregar Insumo</button>
    <button onclick="eliminarInsumoStock()" class="btn" style="background:#f0f0f0;color:#666;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;width:100%;">🗑 Eliminar seleccionado</button>
  </div>
</div>

<!-- MODAL: CONFIRMAR COMANDA + MESA -->
<div class="modal-overlay" id="modalOverlay" onclick="cerrarModalConfirm(event)">
  <div class="modal" id="modalContentConfirmar">
    <div class="modal-header">
      <span style="color:#1a1a1a;">Confirmar Comanda</span>
      <button class="modal-close" onclick="cerrarModalConfirm(null,true)">&times;</button>
    </div>
    <div class="modal-body" id="modalBodyConfirmar"></div>
    <div style="padding:14px 20px 4px;">
      <label style="font-size:13px;font-weight:700;display:block;margin-bottom:5px;">Número de Mesa</label>
      <input type="number" id="modalMesaInput" min="1" max="99" value="1"
        style="width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:18px;font-weight:700;text-align:center;font-family:inherit;background:#f5f5f5;color:#1a1a1a;">
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="event.stopPropagation();cerrarModalConfirm(null,true)">Cancelar</button>
      <button class="btn btn-confirm" onclick="event.stopPropagation();crearComanda()">&#10003; Generar</button>
    </div>
  </div>
</div>

<!-- MODAL: NOTA EN MENÚ -->
<div class="modal-overlay" id="notaMenuOverlay" onclick="cerrarModalNota(event)">
  <div class="modal" id="notaMenuContent">
    <div class="modal-header">
      <span id="notaMenuTitulo">Nota del plato</span>
      <button class="modal-close" onclick="cerrarModalNota(null,true)">&times;</button>
    </div>
    <div class="modal-body">
      <p id="notaMenuPlato" style="font-weight:600;font-size:17px;color:var(--text);margin-bottom:10px;"></p>
      <textarea class="nota-menu-input" id="notaMenuInput" rows="3" placeholder="Ej: sin cebolla, extra queso..."></textarea>
      <div id="notaMenuChip" style="display:none;margin-top:8px;">

function getPlatoById(id) {
  for (const cat of categorias) {
    const p = cat.platos.find(x => x.id === id);
    if (p) return { plato: p, categoria: cat.categoria };
  }
  return null;
}

function formatoHora(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' +
    String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0');
}

function togglePlato(id) {
  // limpiar objetos vacíos primero
  platosSeleccionados = platosSeleccionados.filter(function(p) { return p && p.id; });
  const info = getPlatoById(id);
  if (!info) return;
  const idx = platosSeleccionados.findIndex(function(p) { return p.id === id; });
  if (idx >= 0) {
    platosSeleccionados.splice(idx, 1);
  } else {
    platosSeleccionados.push({
      id: info.plato.id,
      nombre: info.plato.nombre,
      ingredientes: info.plato.ingredientes,
      categoria: info.categoria,
      cantidad: 1,
      nota: ''
    });
  }
  renderPlatos();
  renderSelectedBar();
}

function cambiarCantidad(id, delta) {
  platosSeleccionados = platosSeleccionados.filter(function(p) { return p && p.id; });
  const sel = platosSeleccionados.find(function(p) { return p.id === id; });
  if (!sel) return;
  sel.cantidad = Math.max(1, sel.cantidad + delta);
  renderPlatos();
  renderSelectedBar();
}

let stockInsumos = {};  // { nombre: cantidad }
let stockEditarSeleccion = null;

function loadStock() {
  try {
    const d = localStorage.getItem('comandero_stock');
    if (d) stockInsumos = JSON.parse(d);
    else {
      // Stock inicial vacío — el usuario lo va cargando
      stockInsumos = {};
    }
  } catch(e) { stockInsumos = {}; }
}

function saveStock() {
  localStorage.setItem('comandero_stock', JSON.stringify(stockInsumos));
}

function renderStock() {
  const el = document.getElementById('stockContainer');
  const nombres = Object.keys(stockInsumos);
  if (nombres.length === 0) {
    el.innerHTML = '<div class="empty"><div class="icon">&#128202;</div><h2>Stock vacío</h2><p> Tocá "Editar" para agregar insumos.</p></div>';
    return;
  }
  el.innerHTML = nombres.map(n => {
    const cant = stockInsumos[n];
    const selClass = stockEditarSeleccion === n ? ' style="border-color:var(--primary);background:#FFF3E0;"' : '';
    return '<div class="plato-btn' + selClass + '" onclick="seleccionarInsumoStock(\'' + n.replace(/'/g, "\\'") + '\')" style="flex-direction:row;gap:10px;padding:12px 14px;margin-bottom:6px;">' +
      '<span style="flex:1;font-size:16px;font-weight:700;">' + n + '</span>' +
      '<span style="font-size:18px;font-weight:700;color:' + (cant < 5 ? '#e53935' : cant < 15 ? '#FF9800' : '#2ecc71') + ';">' +
        (Number.isInteger(cant) ? cant : cant.toFixed(2)) +
      '</span>' +
    '</div>';
  }).join('');
}

function toggleEdicionStock() {
  modoEdicionStock = !modoEdicionStock;
  const panel = document.getElementById('editarStockPanel');
  const btn = document.getElementById('toggleEdicionStock');
  if (modoEdicionStock) {
    panel.style.display = 'block';
    btn.textContent = '❌ Cerrar Edición';
    renderStock();
  } else {
    panel.style.display = 'none';
    btn.textContent = '✏️ Editar';
    stockEditarSeleccion = null;
    renderStock();
  }
}

function seleccionarInsumoStock(nombre) {
  if (!modoEdicionStock) return;
  stockEditarSeleccion = nombre;
  document.getElementById('stockNombre').value = nombre;
  document.getElementById('stockCantidad').value = stockInsumos[nombre];
  renderStock();
}

function agregarInsumoStock() {
  const nombre = document.getElementById('stockNombre').value.trim();
  const cant = parseFloat(document.getElementById('stockCantidad').value) || 0;
  if (!nombre) return;
  stockInsumos[nombre] = cant;
  saveStock();
  renderStock();
  document.getElementById('stockNombre').value = '';
  document.getElementById('stockCantidad').value = '';
}

function eliminarInsumoStock() {
  if (!stockEditarSeleccion) return;
  delete stockInsumos[stockEditarSeleccion];
  stockEditarSeleccion = null;
  saveStock();
  renderStock();
}

// Descontar ingredientes de stock al generar una comanda
function descontarStock(platos) {
  for (const p of platos) {
    if (!p || !p.id) continue;  // saltar objetos vacíos
    const key = (p.categoria === 'Panesanos' ? 'pan' : p.categoria === 'Pinsas' ? 'pinsa' : 'plt') + '-' + p.id.split('-')[1];
    const ing = ingredientesBase[key];
    if (ing) {
      for (const [insumo, porciones] of Object.entries(ing)) {
        const total = porciones * p.cantidad;
        stockInsumos[insumo] = (stockInsumos[insumo] || 0) - total;
        if (stockInsumos[insumo] < 0) stockInsumos[insumo] = 0;
      }
    }
  }
  saveStock();
  if (document.getElementById('screenStock').classList.contains('active')) renderStock();
}


function abrirModal() {
  const overlay = document.getElementById('modalOverlay');
  const total = platosSeleccionados.reduce((a, p) => a + p.cantidad, 0);
  const cuerpo = document.getElementById('modalBodyConfirmar');
  cuerpo.innerHTML =
    '<p class="modal-q" style="color:#1a1a1a;">Vas a generar una comanda con <strong>' + total + '</strong> plato(s)</p>' +
    '<div class="resumen-list">' +
      platosSeleccionados.map(function(p) {
        var notaHTML = p.nota ? '<div class="resumen-nota" style="color:#333;">Nota: ' + p.nota + '</div>' : '';
        return '<div class="resumen-item" style="border:1px solid #e0e0e0;"><div style="font-size:15px;color:#1a1a1a;">' + p.nombre + '</div>' + notaHTML + '<div style="font-weight:700;color:#1a1a1a;">x' + p.cantidad + '</div></div>';
      }).join('') +
    '</div>' +
    '<p style="text-align:center;color:#888;font-size:13px;margin-top:12px;">Se guardará en Activas</p>';
  overlay.classList.add('open');
}

function cerrarModalConfirm(e, force) {
  if (force || !e || e.target.id === 'modalOverlay') {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

function crearComanda() {
  // limpiar objetos vacíos
  platosSeleccionados = platosSeleccionados.filter(function(p) { return p && p.id; });
  var mesaInput = document.getElementById("modalMesaInput");
  var mesaVal = mesaInput ? (parseInt(mesaInput.value) || 1) : 1;
  var primeraCat = platosSeleccionados[0] ? platosSeleccionados[0].categoria : "General";
  comandas.push({
    id: Date.now(),
    categoria: primeraCat,
    platos: platosSeleccionados.map(p => ({ ...p })),
    fecha: Date.now(),
    completada: false,
    mesa: mesaVal
  });
  // Descontar stock
  descontarStock(platosSeleccionados);
  platosSeleccionados = [];
  saveData();
  renderPlatos();
  renderSelectedBar();
  cerrarModalConfirm(null, true);
  renderActivas();
  // Si la pantalla de stock está abierta, actualizarla
  if (document.getElementById('screenStock').classList.contains('active')) renderStock();
  switchTab('activas');
  setTimeout(() => { var cont = document.getElementById('activasContainer'); if (cont) cont.scrollTo({ top: cont.scrollHeight, behavior: 'smooth' }); }, 200);
}

// ===== COMANDA: completar / eliminar =====
function completarComanda(id) {
  const c = comandas.find(x => x.id === id);
  if (!c) return;
  c.completada = true;
  saveData();
  renderActivas();
  renderHistorial();
}

function eliminarComanda(id) {
  if (!confirm('¿Eliminar esta comanda?')) return;
  comandas = comandas.filter(c => c.id !== id);
  saveData();
  renderActivas();
  renderHistorial();
}

function finalizarComanda(id) {
  const c = comandas.find(x => x.id === id);
  if (!c) return;
  c.completada = true;
  saveData();
  renderActivas();
  renderHistorial();
  switchTab('activas');
}

// ===== TABS =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  var tabBtn = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (tabBtn) tabBtn.classList.add('active');
  var screen = document.getElementById('screen' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (screen) screen.classList.add('active');
  if (tab === 'activas') renderActivas();
  if (tab === 'historial') renderHistorial();
  if (tab === 'menu') {
    renderCategorias(); renderPlatos();
    // Al volver al menú, cargar los platos de la mesa actual como seleccionados
    loadPedidos();
    if (!document.getElementById('screenPedidos').classList.contains('active')) {
      const listaPedidos = pedidosPorMesa[mesaActual] || [];
      platosSeleccionados = listaPedidos.map(p => ({ ...p }));
      renderSelectedBar();
    }
  }
  if (tab === 'stock') { loadStock(); renderStock(); }
  if (tab === 'pedidos') {
    // Sincronizar platos seleccionados del menú con la mesa actual
    loadPedidos();
    if (platosSeleccionados.length > 0) {
      const lista = pedidosPorMesa[mesaActual] || [];
      for (const p of platosSeleccionados) {
        const idx = lista.findIndex(x => x.id === p.id);
        if (idx >= 0) { lista[idx].cantidad += p.cantidad; }
        else { lista.push({ ...p }); }
      }
      pedidosPorMesa[mesaActual] = lista;
      savePedidos();
      platosSeleccionados = [];
      renderPlatos(); renderSelectedBar();
    }
    renderPedidosMesa();
  }
  if (tab === 'pedidos') { renderPedidosMesa(); }
}


// ===== PEDIDOS POR MESA =====

function loadPedidos() {
  try {
    const d = localStorage.getItem('comandero_pedidos');
    if (d) pedidosPorMesa = JSON.parse(d);
  } catch(e) { pedidosPorMesa = {}; }
}

function savePedidos() {
  localStorage.setItem('comandero_pedidos', JSON.stringify(pedidosPorMesa));
}

function renderPedidosMesa() {
  loadPedidos();
  const mesaNum = parseInt(document.getElementById('pedidoMesa').value) || 1;
  mesaActual = mesaNum;
  const lista = pedidosPorMesa[mesaActual] || [];
  const container = document.getElementById('pedidosMesaContainer');
  const btn = document.getElementById('enviarPedidoBtn');

  btn.disabled = lista.length === 0;

  if (lista.length === 0) {
    container.innerHTML = '<div class="empty" style="padding:30px;"><div class="icon">&#128222;</div><p style="font-size:14px;">No hay platos seleccionados para esta mesa.</p></div>';
    return;
  }

  container.innerHTML = lista.map((p, i) =>
    '<div class="plato-btn" style="padding:12px 14px;margin-bottom:4px;">' +
      '<div style="flex:1;">' +
        '<div style="font-size:16px;font-weight:700;">' + p.nombre + ' <span style="font-size:13px;color:#888;">x' + p.cantidad + '</span></div>' +
        (p.ingredientes ? '<div style="font-size:12px;color:#888;margin-top:2px;">' + p.ingredientes + '</div>' : '') +
        (p.nota ? '<div style="font-size:13px;color:#FF9800;font-style:italic;margin-top:2px;">' + p.nota + '</div>' : '') +
      '</div>' +
      '<button onclick="event.stopPropagation();quitarDePedido(' + i + ')" style="background:none;border:none;font-size:22px;color:#e53935;cursor:pointer;padding:0 6px;">&times;</button>' +
    '</div>'
  ).join('');
}

function quitarDePedido(index) {
  pedidosPorMesa[mesaActual] = (pedidosPorMesa[mesaActual] || []).filter(function(p) { return p && p.id; });
  const lista = pedidosPorMesa[mesaActual];
  if (lista) {
    lista.splice(index, 1);
    if (lista.length === 0) delete pedidosPorMesa[mesaActual];
    else pedidosPorMesa[mesaActual] = lista;
  }
  savePedidos();
  renderPedidosMesa();
  // Si estamos en menú, actualizar platos seleccionados
  if (document.getElementById('screenMenu').classList.contains('active')) {
    platosSeleccionados = (pedidosPorMesa[mesaActual] || []).map(p => ({ ...p }));
    renderPlatos(); renderSelectedBar();
  }
}

function cambiarCantidadPedido(index, delta) {
  const lista = pedidosPorMesa[mesaActual];
  if (!lista) return;
  lista[index].cantidad = Math.max(1, lista[index].cantidad + delta);
  savePedidos();
  renderPedidosMesa();
  // Si estamos en menú, actualizar
  if (document.getElementById('screenMenu').classList.contains('active')) {
    platosSeleccionados = lista.map(p => ({ ...p }));
    renderPlatos(); renderSelectedBar();
  }
}

// Sincronizar pedidos por mesa cuando el usuario cambia de pantalla
function syncPlatosAPedido() {
  loadPedidos();
  if (platosSeleccionados.length === 0) return;
  const lista = pedidosPorMesa[mesaActual] || [];
  for (const p of platosSeleccionados) {
    const idx = lista.findIndex(x => x.id === p.id);
    if (idx >= 0) {
      lista[idx].cantidad += p.cantidad;
    } else {
      lista.push({ ...p });
    }
  }
  pedidosPorMesa[mesaActual] = lista;
  savePedidos();
  platosSeleccionados = [];
  renderPlatos();
  renderSelectedBar();
}

function enviarPedidoCocina() {
  const lista = pedidosPorMesa[mesaActual];
  if (!lista || lista.length === 0) return;
  const primeraCat = lista[0].categoria || 'Pedido de Mesa';
  for (const p of lista) {
    comandas.push({
      id: Date.now() + Math.random(),
      categoria: primeraCat,
      platos: [p],
      fecha: Date.now(),
      completada: false,
      mesa: mesaActual
    });
  }
  delete pedidosPorMesa[mesaActual];
  savePedidos();
  saveData();
  renderActivas();
  renderPedidosMesa();
  renderSelectedBar();
  if (document.getElementById('screenStock').classList.contains('active')) renderStock();
  alert('Pedido de mesa ' + mesaActual + ' enviado a cocina ✓');
}

// ===== INIT =====
loadData();
cargarTema();
loadStock();
loadPedidos();
renderCategorias();
renderPlatos();
renderSelectedBar();
renderActivas();
renderHistorial();

// ===== PWA INSTALL =====
var deferredPrompt = null;
var installBtn = null;

function showInstallBtn() {
  if (installBtn) installBtn.style.display = 'block';
}

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBtn();
});

document.addEventListener('DOMContentLoaded', function() {
  installBtn = document.getElementById('installBtn');
  if (!installBtn) return;
  if (window.navigator.standalone === false && /Android/.test(navigator.userAgent)) {
    setTimeout(showInstallBtn, 2000);
  }
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
    showInstallBtn();
  }
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice) {
      if (choice.outcome === 'accepted') { if (installBtn) installBtn.style.display = 'none'; }
      deferredPrompt = null;
    });
  } else {
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      alert("Para instalar en iPhone/iPad:\n1. Tocá Compartir (abajo centro)\n2. 'Agregar a pantalla de inicio'\n3. Tocá Agregar (arriba derecha)");
    } else if (/Android/.test(navigator.userAgent)) {
      alert("Para instalar: tocá el menú del navegador (⋮) y elegí 'Instalar Comandero' o 'Agregar a pantalla de inicio'.");
    } else {
      alert("Para instalar: tocá el ⚙ del navegador → 'Instalar Comandero de Cocina'.");
    }
  }
}
